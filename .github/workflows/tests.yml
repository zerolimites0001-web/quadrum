name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testes de lógica e regressão (sem navegador)
        run: npm test
      - name: Verificar módulos JavaScript
        run: |
          for file in src/*.js mod-worker.js examples/mods/*.js examples/mods/realistic-water/*.js; do
            node --check "$file"
          done
      - name: Verificar servidor Python
        run: python3 -m py_compile server.py
