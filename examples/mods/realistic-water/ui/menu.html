<aside class="water-mod-controls" data-interactive>
  <button type="button" class="water-expand" title="Configurar água">≈ Água</button>
  <div class="water-options" hidden>
    <strong>Água realista</strong>
    <label>Ondas <input class="water-waves" type="range" min="0" max="1" step=".05" value=".6"></label>
    <label><input class="water-reflection" type="checkbox" checked> Reflexo da cena (8 FPS)</label>
    <label>Resolução <select class="water-quality"><option value="128">128 · leve</option><option value="256" selected>256 · móvel</option><option value="512">512 · pesado</option></select></label>
    <small>Para desligar: Pausa → Mods → Desativar.<br>As ondas são visuais; a física da água não muda.</small>
  </div>
</aside>
